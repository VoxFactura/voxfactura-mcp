[project]
name = "voxfactura-mcp"
version = "0.3.3"
description = "Serveur MCP VoxFactura : branche ton business (factures, dépenses, clients, marge par client, TVA) sur ton assistant IA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ASTERIO 37 (VoxFactura)", email = "contact@voxfactura.com" }]
keywords = ["mcp", "voxfactura", "facturation", "artisan", "claude"]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    # cryptography est tiré par mcp (pyjwt[crypto]). Les versions >=45 ne
    # publient plus de wheel macOS Intel -> compilation Rust/OpenSSL chez les
    # utilisateurs Intel. On borne à <45 (wheels partout : Intel-mac, arm64,
    # Linux, Windows) pour une install sans compilateur.
    "cryptography>=42,<45",
]

[project.scripts]
voxfactura-mcp = "voxfactura_mcp.server:main"

[project.urls]
Homepage = "https://www.voxfactura.com"
Documentation = "https://api.voxfactura.com/api/v1/pub/docs"
Source = "https://github.com/VoxFactura/voxfactura-mcp"
Issues = "https://github.com/VoxFactura/voxfactura-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxfactura_mcp"]
