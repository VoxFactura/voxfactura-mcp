name: publish

# Publie sur PyPI automatiquement quand tu crées une Release GitHub.
# Auth via Trusted Publishing (OIDC) : aucun token stocké.
# Prérequis (une seule fois) : sur https://pypi.org/manage/account/publishing/
# ajouter un publisher -> Project: voxfactura-mcp, Owner: VoxFactura,
# Repository: voxfactura-mcp, Workflow: publish.yml, Environment: (vide).

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requis pour le Trusted Publishing PyPI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
